# ~/.config/herdr/config.toml
onboarding = false

[keys]
prefix = "ctrl+space"

# tmux: bind -n M-L next-window / M-H previous-window
next_tab     = ["prefix+n", "alt+shift+l"]
previous_tab = ["prefix+p", "alt+shift+h"]

# tmux: bind '"' split-window -v  (stacked)
split_horizontal = ["prefix+minus", "prefix+double_quote"]

# tmux: bind '%' split-window -h  (side by side)
split_vertical = ["prefix+v", "prefix+percent"]

[terminal]
new_cwd = "follow"        # your -c "#{pane_current_path}"

[theme]
name = "catppuccin"

[ui]
mouse_capture = true      # your set -g mouse on
prompt_new_tab_name = false

[[keys.command]]
key = "ctrl+h"
type = "plugin_action"
command = "vim-herdr-navigation.left"
description = "navigate left (vim/herdr)"

[[keys.command]]
key = "ctrl+j"
type = "plugin_action"
command = "vim-herdr-navigation.down"
description = "navigate down (vim/herdr)"

[[keys.command]]
key = "ctrl+k"
type = "plugin_action"
command = "vim-herdr-navigation.up"
description = "navigate up (vim/herdr)"

[[keys.command]]
key = "ctrl+l"
type = "plugin_action"
command = "vim-herdr-navigation.right"
description = "navigate right (vim/herdr)"
